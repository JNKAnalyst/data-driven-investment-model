data:
  data_path: "data/financial_data.csv"
  target_column: "returns"
  test_size: 0.2
  random_state: 42

models:
  random_forest:
    n_estimators: 200
    max_depth: 10
    min_samples_split: 5
  knn:
    n_neighbors: 7
  linear_regression:
    fit_intercept: true

evaluation:
  cv_folds: 5
  scoring: "neg_root_mean_squared_error"
